<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexSocial — Vídeo Corporatiu</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0a0a0a;height:100%;overflow:hidden;}
  #root{position:absolute;inset:0;}
  .ctrl-btn{
    position:fixed;top:16px;z-index:9999;
    display:flex;align-items:center;gap:8px;
    background:rgba(15,45,30,.65);backdrop-filter:blur(8px);
    border:1px solid rgba(152,190,149,.30);color:#fff;
    font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;padding:8px 16px;border-radius:40px;
    cursor:pointer;transition:all .25s ease;
  }
  .ctrl-btn:hover{background:rgba(45,107,72,.75);border-color:rgba(152,190,149,.55);}
  #music-btn{right:16px;}
  #restart-btn{right:calc(16px + 160px + 10px);}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!--
  MÚSICA EXTERNA (opcional):
  1. Descarrega una pista de pixabay.com/music (cerca "ambient piano" o "cinematic calm")
  2. Anomena-la "musica.mp3" i posa-la a aquesta mateixa carpeta
  3. Ja funcionarà automàticament

  Si no hi ha musica.mp3 → sona el piano generatiu Web Audio de fallback.
-->
<audio id="bg-audio" loop preload="none" style="display:none"></audio>

<button id="restart-btn" class="ctrl-btn">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
  </svg>
  <span>Reinicia</span>
</button>

<button id="music-btn" class="ctrl-btn">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
  </svg>
  <span id="music-lbl">Activa música</span>
</button>

<script src="music.js"></script>
<script>
(function(){
  const btn   = document.getElementById('music-btn');
  const lbl   = document.getElementById('music-lbl');
  const audio = document.getElementById('bg-audio');
  let playing = false;
  let useMp3  = false;

  // Comprova si musica.mp3 existeix al servidor
  fetch('musica.mp3', { method:'HEAD' })
    .then(r => {
      if (r.ok) {
        useMp3 = true;
        audio.src = 'musica.mp3';
        audio.load();
      }
    })
    .catch(() => {});

  function fadeVolume(target, cb) {
    const step = target > audio.volume ? 0.03 : -0.04;
    const tick = setInterval(() => {
      const next = audio.volume + step;
      if ((step > 0 && next >= target) || (step < 0 && next <= target)) {
        audio.volume = Math.max(0, Math.min(1, target));
        clearInterval(tick);
        if (cb) cb();
      } else {
        audio.volume = Math.max(0, Math.min(1, next));
      }
    }, 60);
  }

  function startMusic() {
    if (useMp3) {
      audio.volume = 0;
      audio.currentTime = 10;
      audio.play().then(() => fadeVolume(0.72)).catch(() => {
        // Si falla MP3, usar Web Audio
        useMp3 = false;
        try { window.NexMusic && window.NexMusic.start(); } catch(e){}
      });
    } else {
      try { window.NexMusic && window.NexMusic.start(); } catch(e){}
    }
    playing = true;
    syncUI(true);
  }

  function stopMusic() {
    if (useMp3 && !audio.paused) {
      fadeVolume(0, () => audio.pause());
    } else {
      try { window.NexMusic && window.NexMusic.stop(); } catch(e){}
    }
    playing = false;
    syncUI(false);
  }

  function syncUI(on) {
    lbl.textContent = on ? 'Pausa música' : 'Activa música';
    btn.style.background = on ? 'rgba(45,107,72,.88)' : 'rgba(15,45,30,.65)';
    btn.style.borderColor = on ? 'rgba(152,190,149,.60)' : 'rgba(152,190,149,.30)';
  }

  btn.addEventListener('click', () => { playing ? stopMusic() : startMusic(); });

  // Escolta ordres del pare via postMessage
  window.addEventListener('message', function(e) {
    if (!e.data || !e.data.action) return;
    if (e.data.action === 'play') {
      // Arrenca animació
      if (typeof window.__nexPlay === 'function') window.__nexPlay();
      // Intenta arrencar música (pot fallar si no hi ha hagut gest previ)
      if (!playing) try { startMusic(); } catch(ex) {}
    } else if (e.data.action === 'pause') {
      // Pausa animació
      if (typeof window.__nexPause === 'function') window.__nexPause();
      if (playing) stopMusic();
    } else if (e.data.action === 'reset') {
      if (playing) stopMusic();
      if (typeof window.__nexRestart === 'function') window.__nexRestart();
    }
  });
})();
</script>

<script type="text/babel" data-presets="react" src="animations.jsx"></script>
<script type="text/babel" data-presets="react" src="scenes.jsx"></script>
<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('root')).render(
    <Stage
      width={1920} height={1080}
      duration={window.VIDEO_DURATION || 35}
      background="#0f2d1e"
      loop={false} autoplay={false}
      persistKey="nexsocial-v7"
    >
      <NexSocialVideo />
    </Stage>
  );

  // Botó reinici — usa RestartBridge exposat des de scenes.jsx
  document.getElementById('restart-btn').addEventListener('click', () => {
    if (typeof window.__nexRestart === 'function') {
      window.__nexRestart();
    }
  });
</script>
</body>
</html>
